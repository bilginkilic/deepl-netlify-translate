services:
  - type: web
    name: deepl-translate-proxy
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DEEPL_AUTH_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Turkuaz chat relay'i (/api/anthropic/v1/messages) korumak için zorunlu:
      # October tarafındaki "Relay Token" ayarıyla aynı değeri girin.
      - key: RELAY_TOKEN
        sync: false
      # Chat'e özel Anthropic anahtarı (SEO'nun ANTHROPIC_API_KEY'ine dokunmadan).
      # Tanımlıysa October tarafında anahtar girmek gerekmez; anahtar RU'daki
      # sunucuda hiç durmaz.
      - key: CHAT_ANTHROPIC_API_KEY
        sync: false
      # İsteğe bağlı: CORS_ORIGIN, DEEPL_API_URL, SEO_MODEL, SEO_MAX_TOKENS
