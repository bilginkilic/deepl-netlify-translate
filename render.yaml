services:
  - type: web
    name: deepl-translate-proxy
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DEEPL_AUTH_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # İsteğe bağlı: CORS_ORIGIN, DEEPL_API_URL, SEO_MODEL, SEO_MAX_TOKENS
