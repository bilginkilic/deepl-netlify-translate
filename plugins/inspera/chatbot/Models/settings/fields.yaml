tabs:
    fields:
        enabled:
            label: Chatbot aktif
            tab: Genel
            type: switch
            default: true

        assistant_name:
            label: Asistan adı
            tab: Genel
            type: text
            default: Inspera Asistan
            span: left

        greeting:
            label: Karşılama mesajı
            tab: Genel
            type: textarea
            size: small
            default: "Merhaba! Inspera Bodrum'a hoş geldiniz 🎨\n\nSize nasıl yardımcı olabilirim?\n\n• 🎨 Akademi & Atölyeler\n• 🎭 Tiyatro & Etkinlikler\n• 🍽️ Gastronomi & Rezervasyon\n• 🛍️ Mağazalar\n• 📅 Rezervasyon Yap"

        menu_items:
            label: Menü / hızlı cevap butonları
            tab: Genel
            type: repeater
            prompt: Menü öğesi ekle
            form:
                fields:
                    label:
                        label: Buton metni
                        type: text
                        span: left
                    message:
                        label: Gönderilecek mesaj
                        type: text
                        span: right
                    is_enabled:
                        label: Aktif
                        type: switch
                        default: true

        booking_enabled:
            label: Kayıt / rezervasyon formu aktif
            tab: Genel
            type: switch
            default: true
            span: left

        booking_title:
            label: Kayıt / rezervasyon başlığı
            tab: Genel
            type: text
            default: Kayıt / rezervasyon talebi
            span: right

        anthropic_api_key:
            label: Anthropic API key
            tab: AI ve maliyet
            type: password
            comment: Boş bırakılırsa ANTHROPIC_API_KEY env değeri kullanılır.

        ai_model:
            label: Model
            tab: AI ve maliyet
            type: text
            default: claude-haiku-4-5
            span: left

        max_tokens:
            label: Maksimum çıkış token
            tab: AI ve maliyet
            type: number
            default: 400
            span: right

        max_client_messages:
            label: İstek başına geçmiş mesaj sınırı
            tab: AI ve maliyet
            type: number
            default: 24
            span: left

        max_message_chars:
            label: Mesaj karakter sınırı
            tab: AI ve maliyet
            type: number
            default: 4000
            span: right

        system_prompt:
            label: Sistem prompt override
            tab: AI ve maliyet
            type: textarea
            size: large
            comment: Boş bırakılırsa plugin içindeki varsayılan prompt kullanılır.

        source_context_limit:
            label: AI'a eklenecek kaynak parçası sınırı
            tab: Veri kaynakları
            type: number
            default: 4
            span: left

        data_sources:
            label: Beslenecek veri kaynakları
            tab: Veri kaynakları
            type: repeater
            prompt: Kaynak ekle
            form:
                fields:
                    is_enabled:
                        label: Aktif
                        type: switch
                        default: true
                        span: left
                    type:
                        label: Kaynak tipi
                        type: dropdown
                        default: static
                        span: right
                        options:
                            static: Statik içerik
                            cms_pages: October CMS sayfaları
                            database_table: Veritabanı tablosu
                    title:
                        label: Kaynak adı
                        type: text
                        span: left
                    keywords:
                        label: Anahtar kelimeler
                        type: taglist
                        separator: comma
                        mode: string
                        span: right
                    content:
                        label: Statik içerik
                        type: textarea
                        size: large
                    table_name:
                        label: Tablo adı
                        type: text
                        span: left
                        comment: database_table için kullanılır.
                    columns:
                        label: Aranacak kolonlar
                        type: text
                        span: right
                        comment: Virgülle ayırın; örn. title,description,content.
                    max_results:
                        label: Maksimum sonuç
                        type: number
                        default: 3
                        span: left

        static_answers:
            label: Statik cevaplar
            tab: Statik cevaplar
            type: repeater
            prompt: Statik cevap ekle
            form:
                fields:
                    is_enabled:
                        label: Aktif
                        type: switch
                        default: true
                        span: left
                    priority:
                        label: Öncelik
                        type: number
                        default: 100
                        span: right
                    trigger:
                        label: Tetikleyici soru / ifade
                        type: text
                        span: left
                    match_type:
                        label: Eşleşme tipi
                        type: dropdown
                        default: contains
                        span: right
                        options:
                            exact: Tam eşleşme
                            contains: İçerir
                            keyword: Anahtar kelime
                    keywords:
                        label: Anahtar kelimeler
                        type: taglist
                        separator: comma
                        mode: string
                    answer:
                        label: Cevap
                        type: textarea
                        size: large

        auto_cache_ai_answers:
            label: AI cevaplarını tekrar kullanım tablosuna kaydet
            tab: Cache
            type: switch
            default: true
            span: left

        auto_approve_cache:
            label: Kaydedilen AI cevaplarını otomatik aktif et
            tab: Cache
            type: switch
            default: true
            span: right

        cache_ttl_days:
            label: Cache geçerlilik süresi (gün)
            tab: Cache
            type: number
            default: 0
            comment: 0 sınırsız demektir.
            span: left

        run_actions_from_chat:
            label: Chat içinden action hook çağır
            tab: Aksiyonlar
            type: switch
            default: true

        actions:
            label: Action / webhook tanımları
            tab: Aksiyonlar
            type: repeater
            prompt: Action ekle
            form:
                fields:
                    is_enabled:
                        label: Aktif
                        type: switch
                        default: true
                        span: left
                    code:
                        label: Action kodu
                        type: text
                        span: right
                    title:
                        label: Başlık
                        type: text
                        span: left
                    trigger_keywords:
                        label: Tetikleyici kelimeler
                        type: taglist
                        separator: comma
                        mode: string
                        span: right
                    hook_url:
                        label: Webhook URL
                        type: text
                    method:
                        label: HTTP metodu
                        type: dropdown
                        default: POST
                        span: left
                        options:
                            POST: POST
                            PUT: PUT
                            PATCH: PATCH
                    headers_json:
                        label: Header JSON
                        type: textarea
                        size: tiny
                        span: right
                        comment: Örn. {"Authorization":"Bearer ..."}
                    payload_template:
                        label: Ek payload JSON
                        type: textarea
                        size: small
                        comment: İsteğe bağlı. Varsayılan payload'a eklenir.
                    success_message:
                        label: Başarı mesajı
                        type: text
                        span: left
                    error_message:
                        label: Hata mesajı
                        type: text
                        span: right
