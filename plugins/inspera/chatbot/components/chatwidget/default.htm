{# Inspera Bodrum Claude widget — Vanilla JS/CSS. Parent layout için: <meta name="csrf-token" content="{{ csrf_token() }}"> #}
<div
    id="inspera-chatbot-root"
    data-endpoint="/inspera-chatbot/message"
    data-config-endpoint="/inspera-chatbot/config"
    data-bookings-endpoint="/inspera-chatbot/api/bookings"
    data-csrf="{{ csrf_token() }}"
>

{% verbatim %}
<style>
#inspera-chatbot-root { --inspera-bg: #1a1a2e; --inspera-accent: #c9a84c; --inspera-white: #ffffff; --inspera-muted: #e8e6e1; }
#inspera-chatbot-root * { box-sizing: border-box; }
#inspera-chatbot-root .ib-launcher {
  position: fixed; right: 1.25rem; bottom: 1.25rem; z-index: 99990;
  width: 3.5rem; height: 3.5rem; border-radius: 50%;
  border: 2px solid var(--inspera-accent);
  background: var(--inspera-bg); color: var(--inspera-accent);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 28px rgba(26, 26, 46, 0.35);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
#inspera-chatbot-root .ib-launcher:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(26, 26, 46, 0.45); }
#inspera-chatbot-root .ib-launcher svg { width: 1.5rem; height: 1.5rem; }
#inspera-chatbot-root .ib-panel {
  position: fixed; right: 1.25rem; bottom: 5.25rem; z-index: 99991;
  width: min(22rem, calc(100vw - 2.5rem)); max-height: min(36rem, 78vh);
  display: none; flex-direction: column;
  background: var(--inspera-white); border-radius: 16px; overflow: hidden;
  box-shadow: 0 16px 48px rgba(26, 26, 46, 0.25);
  border: 1px solid rgba(201, 168, 76, 0.35);
}
#inspera-chatbot-root .ib-panel.ib-open { display: flex; }
#inspera-chatbot-root .ib-header {
  background: var(--inspera-bg); color: var(--inspera-white);
  padding: 0.9rem 1rem; display: flex; align-items: center; justify-content: space-between;
  font-family: Georgia, "Times New Roman", serif; letter-spacing: 0.02em;
}
#inspera-chatbot-root .ib-title { font-size: 1rem; font-weight: 600; }
#inspera-chatbot-root .ib-sub { font-size: 0.7rem; opacity: 0.85; margin-top: 0.15rem; }
#inspera-chatbot-root .ib-close {
  background: transparent; border: none; color: var(--inspera-accent);
  cursor: pointer; font-size: 1.25rem; line-height: 1; padding: 0.25rem;
}
#inspera-chatbot-root .ib-messages {
  flex: 1; min-height: 0; overflow-y: auto; padding: 0.85rem; gap: 0.65rem; display: flex; flex-direction: column;
  background: linear-gradient(180deg, #faf9f7 0%, #f3f1ec 100%);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 0.9rem;
}
#inspera-chatbot-root .ib-booking-wrap { flex-shrink: 0; border-top: 1px solid rgba(26, 26, 46, 0.08); background: #f4f3ef; font-size: 0.78rem; }
#inspera-chatbot-root .ib-booking-wrap.ib-hidden-booking { display: none !important; }
#inspera-chatbot-root .ib-booking-toggle {
  width: 100%; padding: 0.45rem 0.75rem; border: none; background: transparent; cursor: pointer;
  color: var(--inspera-bg); font-weight: 600; font-size: inherit; text-align: left; font-family: inherit;
}
#inspera-chatbot-root .ib-booking-panel { display: none; padding: 0.5rem 0.65rem 0.65rem; }
#inspera-chatbot-root .ib-booking-panel.ib-expanded { display: block; max-height: 12.5rem; overflow-y: auto; }
#inspera-chatbot-root .ib-booking-panel label { display: block; margin-top: 0.35rem; color: var(--inspera-bg); }
#inspera-chatbot-root .ib-booking-panel input,
#inspera-chatbot-root .ib-booking-panel select,
#inspera-chatbot-root .ib-booking-panel textarea {
  width: 100%; margin-top: 0.15rem; padding: 0.35rem 0.45rem; border-radius: 8px;
  border: 1px solid rgba(26, 26, 46, 0.18); font-family: inherit; font-size: 0.8rem;
}
#inspera-chatbot-root .ib-booking-panel textarea { min-height: 2.25rem; resize: vertical; }
#inspera-chatbot-root .ib-book-check { display: flex; align-items: center; gap: 0.35rem; margin-top: 0.4rem; }
#inspera-chatbot-root .ib-book-check input { width: auto; margin: 0; }
#inspera-chatbot-root .ib-book-submit {
  margin-top: 0.55rem; width: 100%; padding: 0.45rem; border-radius: 10px; border: none; cursor: pointer;
  font-weight: 700; font-family: inherit; background: var(--inspera-accent); color: var(--inspera-bg);
}
#inspera-chatbot-root .ib-book-submit:disabled { opacity: 0.55; cursor: not-allowed; }
#inspera-chatbot-root .ib-row { display: flex; width: 100%; }
#inspera-chatbot-root .ib-row.ib-user { justify-content: flex-end; }
#inspera-chatbot-root .ib-row.ib-bot { justify-content: flex-start; }
#inspera-chatbot-root .ib-bubble {
  max-width: 88%; padding: 0.55rem 0.75rem; border-radius: 14px; line-height: 1.45;
  white-space: pre-wrap; word-break: break-word;
}
#inspera-chatbot-root .ib-bubble.ib-user {
  background: var(--inspera-bg); color: var(--inspera-white);
  border-bottom-right-radius: 4px;
}
#inspera-chatbot-root .ib-bubble.ib-bot {
  background: #fff; color: var(--inspera-bg); border: 1px solid rgba(26, 26, 46, 0.08);
  border-bottom-left-radius: 4px;
}
#inspera-chatbot-root .ib-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.35rem; }
#inspera-chatbot-root .ib-chip {
  font-size: 0.75rem; padding: 0.35rem 0.55rem; border-radius: 999px;
  border: 1px solid rgba(201, 168, 76, 0.55); background: #fff; color: var(--inspera-bg);
  cursor: pointer; font-family: inherit;
}
#inspera-chatbot-root .ib-chip:hover { background: rgba(201, 168, 76, 0.12); }
#inspera-chatbot-root .ib-typing { display: none; align-items: center; gap: 0.25rem; padding: 0.35rem 0.5rem; }
#inspera-chatbot-root .ib-typing.ib-visible { display: flex; }
#inspera-chatbot-root .ib-typing span {
  width: 0.35rem; height: 0.35rem; background: var(--inspera-accent); border-radius: 50%;
  animation: ib-bounce 1s infinite ease-in-out;
}
#inspera-chatbot-root .ib-typing span:nth-child(2) { animation-delay: 0.15s; }
#inspera-chatbot-root .ib-typing span:nth-child(3) { animation-delay: 0.3s; }
@keyframes ib-bounce { 0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }
#inspera-chatbot-root .ib-inputbar {
  border-top: 1px solid rgba(26, 26, 46, 0.08); padding: 0.55rem; display: flex; gap: 0.45rem;
  background: #fff;
}
#inspera-chatbot-root .ib-input {
  flex: 1; border: 1px solid rgba(26, 26, 46, 0.15); border-radius: 10px; padding: 0.5rem 0.65rem;
  font-size: 0.9rem; font-family: inherit; outline: none;
}
#inspera-chatbot-root .ib-input:focus { border-color: var(--inspera-accent); }
#inspera-chatbot-root .ib-send {
  background: var(--inspera-accent); color: var(--inspera-bg); border: none; border-radius: 10px;
  padding: 0 1rem; font-weight: 600; cursor: pointer; font-family: inherit;
}
#inspera-chatbot-root .ib-send:disabled { opacity: 0.55; cursor: not-allowed; }
@media (max-width: 480px) {
  #inspera-chatbot-root .ib-panel { max-height: 75vh; width: calc(100vw - 2rem); right: 1rem; }
  #inspera-chatbot-root .ib-launcher { right: 1rem; bottom: 1rem; }
}
</style>

<button type="button" class="ib-launcher" id="ib-launcher" aria-label="Sohbeti aç" aria-expanded="false">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
  </svg>
</button>

<div class="ib-panel" id="ib-panel" role="dialog" aria-label="Inspera Asistan">
  <div class="ib-header">
    <div>
      <div class="ib-title">Inspera Asistan</div>
      <div class="ib-sub">Inspera Bodrum</div>
    </div>
    <button type="button" class="ib-close" id="ib-close" aria-label="Kapat">×</button>
  </div>
  <div class="ib-messages" id="ib-messages"></div>
  <div class="ib-booking-wrap" id="ib-booking-wrap">
    <button type="button" class="ib-booking-toggle" id="ib-booking-toggle" aria-expanded="false">Kayıt / rezervasyon talebi ▸</button>
    <div class="ib-booking-panel" id="ib-booking-panel">
      <form id="ib-booking-form">
        <label>Talep türü *
          <select name="request_type" id="ib-book-type" required>
            <option value="workshop">Atölye</option>
            <option value="theater">Tiyatro</option>
            <option value="restaurant">Restoran</option>
            <option value="other">Diğer</option>
          </select>
        </label>
        <label>Ad soyad *
          <input type="text" name="full_name" id="ib-book-name" maxlength="191" autocomplete="name" required />
        </label>
        <label>E-posta
          <input type="email" name="email" id="ib-book-email" maxlength="191" autocomplete="email" />
        </label>
        <label>Telefon
          <input type="tel" name="phone" id="ib-book-phone" maxlength="64" autocomplete="tel" />
        </label>
        <label>Tercih (tarih / saat)
          <input type="text" name="preferred_datetime_text" id="ib-book-when" maxlength="500" placeholder="Örn. 14 Haziran akşam" />
        </label>
        <label>Kişi sayısı
          <input type="number" name="party_size" id="ib-book-party" min="1" max="500" placeholder="İsteğe bağlı" />
        </label>
        <label>Not
          <textarea name="notes" id="ib-book-notes" maxlength="5000" placeholder="İsteğe bağlı"></textarea>
        </label>
        <label class="ib-book-check"><input type="checkbox" id="ib-book-include-chat" checked /><span>Kayıta sohbet geçmişini ekle</span></label>
        <button type="submit" class="ib-book-submit" id="ib-book-submit">Talebi ilet</button>
      </form>
    </div>
  </div>
  <div class="ib-inputbar">
    <input type="text" class="ib-input" id="ib-input" placeholder="Mesajınızı yazın…" autocomplete="off" maxlength="4000" />
    <button type="button" class="ib-send" id="ib-send">Gönder</button>
  </div>
</div>

<script>
(function () {
  var root = document.getElementById('inspera-chatbot-root');
  if (!root) return;

  var ENDPOINT = root.dataset.endpoint || '/inspera-chatbot/message';
  var CONFIG_ENDPOINT = root.dataset.configEndpoint || '/inspera-chatbot/config';
  var BOOKING_ENDPOINT = (root.dataset.bookingsEndpoint || '').trim();
  var CSRF = root.dataset.csrf || '';
  var meta = document.querySelector('meta[name="csrf-token"]');
  if (meta && meta.getAttribute('content')) CSRF = meta.getAttribute('content');

  var bookingWrap = document.getElementById('ib-booking-wrap');
  var bookingToggle = document.getElementById('ib-booking-toggle');
  var bookingPanel = document.getElementById('ib-booking-panel');
  var bookingForm = document.getElementById('ib-booking-form');
  var bookSubmit = document.getElementById('ib-book-submit');
  var bookIncludeChat = document.getElementById('ib-book-include-chat');

  if (bookingWrap && !BOOKING_ENDPOINT) {
    bookingWrap.classList.add('ib-hidden-booking');
  }

  function mapBookingPayloadMessage(data, status) {
    if (!data || typeof data !== 'object') {
      return 'Kayıt gönderilemedi. Lütfen alanları kontrol edin.';
    }
    if (typeof data.message === 'string' && data.message) return data.message;
    if (data.errors && typeof data.errors === 'object') {
      var keys = Object.keys(data.errors);
      if (keys.length && data.errors[keys[0]] && data.errors[keys[0]][0]) {
        return data.errors[keys[0]][0];
      }
    }
    if (status === 429) return 'Çok fazla istek. Lütfen kısa süre sonra tekrar deneyin.';
    return 'Kayıt gönderilemedi. Lütfen alanları kontrol edin.';
  }

  if (bookingToggle && bookingPanel) {
    bookingToggle.addEventListener('click', function () {
      var open = !bookingPanel.classList.contains('ib-expanded');
      bookingPanel.classList.toggle('ib-expanded', open);
      bookingToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      bookingToggle.textContent = open
        ? 'Kayıt / rezervasyon talebi ▾'
        : 'Kayıt / rezervasyon talebi ▸';
    });
  }

  if (bookingForm && BOOKING_ENDPOINT) {
    bookingForm.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!bookSubmit) return;

      var emailVal = (document.getElementById('ib-book-email').value || '').trim();
      var phoneVal = (document.getElementById('ib-book-phone').value || '').trim();
      if (!emailVal && !phoneVal) {
        row('ib-bot', 'ib-bot', 'E-posta veya telefon alanlarından en az birini doldurun.');
        return;
      }

      var partyEl = document.getElementById('ib-book-party');
      var partyRaw = (partyEl.value || '').trim();

      var payload = {
        request_type: document.getElementById('ib-book-type').value,
        full_name: (document.getElementById('ib-book-name').value || '').trim(),
        email: emailVal || null,
        phone: phoneVal || null,
        preferred_datetime_text: (document.getElementById('ib-book-when').value || '').trim() || null,
        notes: (document.getElementById('ib-book-notes').value || '').trim() || null
      };

      if (partyRaw) {
        var pn = parseInt(partyRaw, 10);
        if (!isNaN(pn)) payload.party_size = pn;
      }

      if (bookIncludeChat && bookIncludeChat.checked && conversationHistory.length) {
        payload.conversation_snapshot = conversationHistory.slice(-40);
      }

      bookSubmit.disabled = true;

      var h = { 'Content-Type': 'application/json', Accept: 'application/json', 'X-Requested-With': 'XMLHttpRequest' };
      if (CSRF) h['X-CSRF-TOKEN'] = CSRF;

      fetch(BOOKING_ENDPOINT, {
        method: 'POST',
        credentials: 'same-origin',
        headers: h,
        body: JSON.stringify(payload)
      })
        .then(function (res) {
          return res.text().then(function (text) {
            var data = {};
            try { data = text ? JSON.parse(text) : {}; } catch (ignore) {}
            return { ok: res.ok, status: res.status, data: data };
          });
        })
        .then(function (ctx) {
          if (ctx.ok) {
            var okMsg = typeof ctx.data.message === 'string' ? ctx.data.message : 'Talebiniz kaydedildi.';
            row('ib-bot', 'ib-bot', okMsg);
            bookingForm.reset();
            if (bookIncludeChat) bookIncludeChat.checked = true;
            return;
          }
          row('ib-bot', 'ib-bot', mapBookingPayloadMessage(ctx.data, ctx.status));
        })
        .catch(function () {
          row('ib-bot', 'ib-bot', 'Bağlantı hatası. Talep gönderilemedi.');
        })
        .finally(function () {
          bookSubmit.disabled = false;
        });
    });
  }

  var quickReplies = [
    { label: "Atölye bilgisi almak istiyorum", message: "Atölye bilgisi almak istiyorum" },
    { label: "Tiyatro programı nedir?", message: "Tiyatro programı nedir?" },
    { label: "Rezervasyon yapmak istiyorum", message: "Rezervasyon yapmak istiyorum" },
    { label: "Voyn Kitchen menüsü nedir?", message: "Voyn Kitchen menüsü nedir?" }
  ];

  var greeting =
    "Merhaba! Inspera Bodrum'a hoş geldiniz 🎨\n\n" +
    "Size nasıl yardımcı olabilirim?\n\n" +
    "• 🎨 Akademi & Atölyeler\n" +
    "• 🎭 Tiyatro & Etkinlikler  \n" +
    "• 🍽️ Gastronomi & Rezervasyon\n" +
    "• 🛍️ Mağazalar\n" +
    "• 📅 Rezervasyon Yap";

  var conversationHistory = [];
  var chipsVisible = false;
  var panelOpen = false;

  var launcher = document.getElementById('ib-launcher');
  var panel = document.getElementById('ib-panel');
  var closeBtn = document.getElementById('ib-close');
  var messagesEl = document.getElementById('ib-messages');
  var input = document.getElementById('ib-input');
  var sendBtn = document.getElementById('ib-send');

  function row(className, bubbleClass, text) {
    var row = document.createElement('div');
    row.className = 'ib-row ' + className;
    var b = document.createElement('div');
    b.className = 'ib-bubble ' + bubbleClass;
    b.textContent = text;
    row.appendChild(b);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function renderChips() {
    var wrap = document.createElement('div');
    wrap.className = 'ib-row ib-bot';
    var inner = document.createElement('div');
    inner.className = 'ib-bubble ib-bot';
    var chips = document.createElement('div');
    chips.className = 'ib-chips';
    quickReplies.forEach(function (item) {
      var txt = typeof item === 'string' ? item : item.label;
      var msg = typeof item === 'string' ? item : (item.message || item.label);
      if (!txt || !msg) return;
      var c = document.createElement('button');
      c.type = 'button';
      c.className = 'ib-chip';
      c.textContent = txt;
      c.addEventListener('click', function () { submitUser(msg); });
      chips.appendChild(c);
    });
    inner.appendChild(chips);
    wrap.appendChild(inner);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showTyping(show) {
    var id = 'ib-typing-indicator';
    var el = document.getElementById(id);
    if (show) {
      if (!el) {
        el = document.createElement('div');
        el.id = id;
        el.className = 'ib-row ib-bot';
        var inner = document.createElement('div');
        inner.className = 'ib-bubble ib-bot';
        var t = document.createElement('div');
        t.className = 'ib-typing ib-visible';
        t.innerHTML = '<span></span><span></span><span></span>';
        inner.appendChild(t);
        el.appendChild(inner);
        messagesEl.appendChild(el);
      } else el.querySelector('.ib-typing').classList.add('ib-visible');
    } else if (el) el.remove();
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function mapError(payload, status) {
    if (payload && payload.message && typeof payload.message === 'string') return payload.message;
    if (payload && payload.error) return payload.error;
    if (status === 429)
      return 'Çok fazla istek gönderildi. Lütfen kısa bir süre sonra tekrar deneyin.';
    if (!status || status >= 500)
      return 'Bir bağlantı veya sunucu hatası oluştu. Lütfen daha sonra deneyin.';
    return 'Bir sorun oluştu. Lütfen biraz sonra tekrar deneyin.';
  }

  function applyConfig(data) {
    if (!data || typeof data !== 'object') return;
    if (data.enabled === false) {
      root.style.display = 'none';
      return;
    }

    if (typeof data.greeting === 'string' && data.greeting.trim()) {
      greeting = data.greeting;
    }

    if (Array.isArray(data.menu_items) && data.menu_items.length) {
      quickReplies = data.menu_items
        .map(function (item) {
          if (typeof item === 'string') return { label: item, message: item };
          if (!item || typeof item !== 'object') return null;
          return {
            label: String(item.label || '').trim(),
            message: String(item.message || item.label || '').trim()
          };
        })
        .filter(function (item) { return item && item.label && item.message; });
    }

    if (typeof data.assistant_name === 'string' && data.assistant_name.trim()) {
      var title = document.querySelector('#inspera-chatbot-root .ib-title');
      if (title) title.textContent = data.assistant_name;
    }

    if (typeof data.booking_title === 'string' && data.booking_title.trim() && bookingToggle) {
      bookingToggle.textContent = data.booking_title + ' ▸';
    }

    if (data.booking_enabled === false && bookingWrap) {
      bookingWrap.classList.add('ib-hidden-booking');
    }
  }

  function fetchConfig() {
    if (!CONFIG_ENDPOINT) return;
    var h = { Accept: 'application/json', 'X-Requested-With': 'XMLHttpRequest' };
    if (CSRF) h['X-CSRF-TOKEN'] = CSRF;
    fetch(CONFIG_ENDPOINT, {
      method: 'GET',
      credentials: 'same-origin',
      headers: h
    })
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(applyConfig)
      .catch(function () {});
  }

  function appendWelcome() {
    row('ib-bot', 'ib-bot', greeting);
    renderChips();
    chipsVisible = true;
  }

  function togglePanel(force) {
    panelOpen = force !== undefined ? force : !panelOpen;
    panel.classList.toggle('ib-open', panelOpen);
    launcher.setAttribute('aria-expanded', panelOpen ? 'true' : 'false');
    if (panelOpen && conversationHistory.length === 0 && messagesEl.children.length === 0) {
      appendWelcome();
      input.focus();
    }
  }

  function submitUser(text) {
    var trimmed = (text || '').trim();
    if (!trimmed) return;

    row('ib-user', 'ib-user', trimmed);
    conversationHistory.push({ role: 'user', content: trimmed });

    if (chipsVisible) {
      chipsVisible = false;
      var wraps = messagesEl.querySelectorAll('.ib-chips');
      wraps.forEach(function (n) { n.closest('.ib-row').remove(); });
    }

    sendAssistant();
  }

  function sendAssistant() {
    sendBtn.disabled = true;
    input.disabled = true;
    showTyping(true);

    var headers = { 'Content-Type': 'application/json', Accept: 'application/json', 'X-Requested-With': 'XMLHttpRequest' };
    if (CSRF) headers['X-CSRF-TOKEN'] = CSRF;

    fetch(ENDPOINT, {
      method: 'POST',
      credentials: 'same-origin',
      headers: headers,
      body: JSON.stringify({ messages: conversationHistory })
    })
      .then(function (res) {
        return res.text().then(function (text) {
          var data = {};
          try {
            data = text ? JSON.parse(text) : {};
          } catch (ignore) {
            data = {};
          }
          return { ok: res.ok, status: res.status, data: data };
        });
      })
      .then(function (ctx) {
        showTyping(false);
        if (!ctx.ok) throw ctx;
        var msg = typeof ctx.data.message === 'string' ? ctx.data.message : '';
        if (!msg.trim()) msg = '(Yanıt alınamadı. Lütfen tekrar deneyin.)';
        conversationHistory.push({ role: 'assistant', content: msg });
        row('ib-bot', 'ib-bot', msg);
      })
      .catch(function (ctx) {
        showTyping(false);
        if (ctx && ctx.data !== undefined) {
          var payload = ctx.data;
          var status = ctx.status;
          row('ib-bot', 'ib-bot', mapError(payload, status));
          return;
        }
        row('ib-bot', 'ib-bot', 'Bağlantı kurulamadı. Lütfen ağ bağlantınızı kontrol edin.');
      })
      .finally(function () {
        sendBtn.disabled = false;
        input.disabled = false;
        input.focus();
      });
  }

  fetchConfig();

  launcher.addEventListener('click', function () { togglePanel(); });
  closeBtn.addEventListener('click', function () { togglePanel(false); });
  sendBtn.addEventListener('click', function () {
    submitUser(input.value);
    input.value = '';
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      submitUser(input.value);
      input.value = '';
    }
  });
})();
</script>
